{% extends "deteccion/base.html" %}
{% block titulo %}Cámara del servidor{% endblock %}
{% block contenido %}
<h1>Cámara del servidor (MJPEG)</h1>
<div class="tarjeta video-caja">
  <div class="pantalla">
    <img id="stream" alt="Transmisión del servidor">
    <div id="placeholder" class="placeholder">Transmisión detenida</div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  // La transmisión empieza sola al abrir la página
  const img = document.getElementById('stream');
  img.src = "{% url 'deteccion:stream' %}?detectar=1&guardar=1&t=" + Date.now();
  img.style.display = 'block';
  document.getElementById('placeholder').style.display = 'none';
</script>
{% endblock %}
